<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bills & Receipts API Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-result { margin: 20px 0; padding: 15px; border-radius: 5px; }
        .success { background-color: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .error { background-color: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
        .receipt-item { margin: 10px 0; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        .loading { color: #007bff; }
    </style>
</head>
<body>
    <h1>🧾 Bills & Receipts API Test</h1>
    <p>Testing the fixed bills and receipts API endpoint</p>
    
    <div id="testResult" class="loading">Running test...</div>
    
    <script>
        async function testBillsReceiptsAPI() {
            const resultDiv = document.getElementById('testResult');
            
            try {
                // First establish a session for homeowner 32
                const loginResponse = await fetch('/buildhub/backend/api/homeowner/login.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        email: 'shijin@example.com',
                        password: 'password123'
                    })
                });
                
                if (!loginResponse.ok) {
                    throw new Error('Login failed');
                }
                
                // Now test the bills and receipts API
                const response = await fetch('/buildhub/backend/api/homeowner/get_bills_receipts.php', {
                    method: 'GET',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.success) {
                    resultDiv.className = 'test-result success';
                    resultDiv.innerHTML = `
                        <h3>✅ API Test Successful!</h3>
                        <p><strong>Message:</strong> ${data.message}</p>
                        <p><strong>Total Receipts:</strong> ${data.data.statistics.total_receipts}</p>
                        <p><strong>Verified:</strong> ${data.data.statistics.verified_count}</p>
                        <p><strong>Pending:</strong> ${data.data.statistics.pending_count}</p>
                        <p><strong>Total Amount:</strong> ₹${data.data.statistics.total_amount.toLocaleString()}</p>
                        
                        <h4>Receipt Details:</h4>
                        ${data.data.receipts.map(receipt => `
                            <div class="receipt-item">
                                <strong>${receipt.payment_type_badge.icon} ${receipt.request_title}</strong><br>
                                Amount: ₹${parseFloat(receipt.requested_amount).toLocaleString()}<br>
                                Status: ${receipt.verification_badge.icon} ${receipt.verification_badge.text}<br>
                                Contractor: ${receipt.contractor_first_name} ${receipt.contractor_last_name}<br>
                                Files: ${receipt.receipt_files_count} file(s)
                            </div>
                        `).join('')}
                    `;
                } else {
                    resultDiv.className = 'test-result error';
                    resultDiv.innerHTML = `
                        <h3>❌ API Test Failed</h3>
                        <p><strong>Error:</strong> ${data.message}</p>
                    `;
                }
                
            } catch (error) {
                resultDiv.className = 'test-result error';
                resultDiv.innerHTML = `
                    <h3>❌ Test Failed</h3>
                    <p><strong>Error:</strong> ${error.message}</p>
                `;
            }
        }
        
        // Run the test when page loads
        testBillsReceiptsAPI();
    </script>
</body>
</html>
