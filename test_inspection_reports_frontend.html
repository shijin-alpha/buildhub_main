<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Inspection Reports Frontend</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .report-card { 
            border: 1px solid #ddd; 
            padding: 20px; 
            margin: 10px 0; 
            border-radius: 8px; 
            background: #f9f9f9; 
        }
        .loading { text-align: center; padding: 40px; }
        .error { color: red; padding: 20px; background: #ffe6e6; border-radius: 4px; }
        .success { color: green; padding: 20px; background: #e6ffe6; border-radius: 4px; }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin: 20px 0; }
        .stat-card { background: white; padding: 15px; border-radius: 8px; text-align: center; border: 1px solid #ddd; }
        .debug-info { background: #f0f0f0; padding: 15px; border-radius: 4px; margin: 10px 0; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 4px; overflow-x: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Inspection Reports Test</h1>
        
        <div id="debug-info" class="debug-info">
            <h3>Debug Information:</h3>
            <div id="debug-content">Loading...</div>
        </div>

        <div id="loading" class="loading">
            <div style="font-size: 48px; margin-bottom: 16px;">🔍</div>
            <h3>Loading Inspection Reports...</h3>
            <p>Testing API connection and data retrieval...</p>
        </div>

        <div id="error" class="error" style="display: none;"></div>
        <div id="success" class="success" style="display: none;"></div>

        <div id="stats-container" style="display: none;">
            <h2>📊 Statistics</h2>
            <div id="stats" class="stats"></div>
        </div>

        <div id="reports-container" style="display: none;">
            <h2>📋 Inspection Reports</h2>
            <div id="reports"></div>
        </div>

        <div id="raw-data" style="display: none;">
            <h2>🔧 Raw API Response</h2>
            <pre id="raw-json"></pre>
        </div>
    </div>

    <script>
        // Establish session first
        async function establishSession() {
            try {
                const response = await fetch('/buildhub/backend/api/homeowner/session_bridge.php', {
                    credentials: 'include'
                });
                const data = await response.json();
                console.log('Session establishment:', data);
                return data.success;
            } catch (error) {
                console.warn('Session establishment error:', error);
                return false;
            }
        }

        // Fetch inspection reports
        async function fetchInspectionReports() {
            const debugContent = document.getElementById('debug-content');
            
            try {
                debugContent.innerHTML = 'Establishing session...';
                
                // First establish session
                const sessionEstablished = await establishSession();
                debugContent.innerHTML += `<br>Session established: ${sessionEstablished}`;
                
                debugContent.innerHTML += '<br>Fetching inspection reports...';
                
                const response = await fetch('/buildhub/backend/api/homeowner/get_inspection_reports.php', {
                    method: 'GET',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });

                debugContent.innerHTML += `<br>Response status: ${response.status}`;
                debugContent.innerHTML += `<br>Response headers: ${JSON.stringify([...response.headers.entries()])}`;

                const result = await response.json();
                
                debugContent.innerHTML += `<br>Response received: ${JSON.stringify(result, null, 2).substring(0, 200)}...`;

                document.getElementById('loading').style.display = 'none';

                if (result.success) {
                    document.getElementById('success').style.display = 'block';
                    document.getElementById('success').innerHTML = `✅ Successfully loaded ${result.reports.length} inspection reports`;
                    
                    // Show statistics
                    if (result.statistics) {
                        document.getElementById('stats-container').style.display = 'block';
                        const statsHtml = `
                            <div class="stat-card">
                                <div style="font-size: 24px; font-weight: bold; color: #0369a1;">${result.statistics.total_reports}</div>
                                <div style="color: #64748b; font-size: 14px;">Total Reports</div>
                            </div>
                            <div class="stat-card">
                                <div style="font-size: 24px; font-weight: bold; color: #16a34a;">${result.statistics.approved_count}</div>
                                <div style="color: #64748b; font-size: 14px;">Approved</div>
                            </div>
                            <div class="stat-card">
                                <div style="font-size: 24px; font-weight: bold; color: #d97706;">${result.statistics.needs_attention_count}</div>
                                <div style="color: #64748b; font-size: 14px;">Need Attention</div>
                            </div>
                            <div class="stat-card">
                                <div style="font-size: 24px; font-weight: bold; color: #dc2626;">${result.statistics.rejected_count}</div>
                                <div style="color: #64748b; font-size: 14px;">Rejected</div>
                            </div>
                        `;
                        document.getElementById('stats').innerHTML = statsHtml;
                    }
                    
                    // Show reports
                    if (result.reports && result.reports.length > 0) {
                        document.getElementById('reports-container').style.display = 'block';
                        const reportsHtml = result.reports.map(report => `
                            <div class="report-card">
                                <h3>🏗️ ${report.project.name}</h3>
                                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin: 15px 0;">
                                    <div><strong>Inspector:</strong> ${report.inspector.name}</div>
                                    <div><strong>Date:</strong> ${new Date(report.inspection.date).toLocaleDateString()}</div>
                                    <div><strong>Status:</strong> 
                                        <span style="padding: 4px 8px; border-radius: 12px; font-size: 12px; font-weight: 600; 
                                            background: ${report.inspection.status === 'approved' ? '#d1fae5' : 
                                                       report.inspection.status === 'rejected' ? '#fee2e2' : 
                                                       report.inspection.status === 'needs_attention' ? '#fef3c7' : '#f3f4f6'};
                                            color: ${report.inspection.status === 'approved' ? '#065f46' : 
                                                    report.inspection.status === 'rejected' ? '#991b1b' : 
                                                    report.inspection.status === 'needs_attention' ? '#92400e' : '#374151'};">
                                            ${report.inspection.status.toUpperCase()}
                                        </span>
                                    </div>
                                </div>
                                <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin: 15px 0;">
                                    <div><strong>Stage:</strong> ${report.inspection.stage}</div>
                                    <div><strong>Type:</strong> ${report.inspection.type}</div>
                                    <div><strong>Quality Score:</strong> ${report.inspection.quality_score || 'N/A'}</div>
                                    <div><strong>Safety:</strong> ${report.inspection.safety_compliance}</div>
                                </div>
                                ${report.inspection.notes ? `<div style="background: #f0f0f0; padding: 10px; border-radius: 4px; margin: 10px 0;"><strong>Notes:</strong> ${report.inspection.notes}</div>` : ''}
                                ${report.inspection.recommendations ? `<div style="background: #e3f2fd; padding: 10px; border-radius: 4px; margin: 10px 0;"><strong>Recommendations:</strong> ${report.inspection.recommendations}</div>` : ''}
                                ${report.inspection.issues_identified ? `<div style="background: #fef3c7; padding: 10px; border-radius: 4px; margin: 10px 0;"><strong>Issues:</strong> ${report.inspection.issues_identified}</div>` : ''}
                            </div>
                        `).join('');
                        document.getElementById('reports').innerHTML = reportsHtml;
                    }
                    
                    // Show raw data
                    document.getElementById('raw-data').style.display = 'block';
                    document.getElementById('raw-json').textContent = JSON.stringify(result, null, 2);
                    
                } else {
                    document.getElementById('error').style.display = 'block';
                    document.getElementById('error').innerHTML = `❌ Failed to load inspection reports: ${result.message}`;
                }
                
            } catch (error) {
                console.error('Error fetching inspection reports:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').innerHTML = `❌ Error fetching inspection reports: ${error.message}`;
                
                debugContent.innerHTML += `<br>Error: ${error.message}`;
            }
        }

        // Load reports when page loads
        document.addEventListener('DOMContentLoaded', fetchInspectionReports);
    </script>
</body>
</html>
