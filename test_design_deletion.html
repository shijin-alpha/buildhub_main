<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Design Deletion</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        
        .btn {
            background: linear-gradient(135deg, #007bff, #0056b3);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        
        .btn.danger {
            background: linear-gradient(135deg, #dc3545, #c82333);
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 123, 255, 0.3);
        }
        
        .btn:disabled {
            background: #6c757d;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.4;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        
        .result.success {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        
        .result.error {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        
        .design-list {
            margin: 20px 0;
        }
        
        .design-item {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            background-color: #f9f9f9;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .design-info {
            flex: 1;
        }
        
        .design-title {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        
        .design-meta {
            font-size: 12px;
            color: #666;
        }
        
        .design-actions {
            display: flex;
            gap: 10px;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #007bff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🗑️ Test Design Deletion</h1>
        <p>Test the enhanced delete functionality that handles both regular designs and house plans.</p>
        
        <button onclick="loadDesigns()" class="btn">📋 Load Received Designs</button>
        <button onclick="clearResults()" class="btn">🗑️ Clear Results</button>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Loading designs...</p>
        </div>
        
        <div id="designList" class="design-list"></div>
        <div id="result"></div>
    </div>

    <script>
        let currentDesigns = [];
        
        async function loadDesigns() {
            const loadingDiv = document.getElementById('loading');
            const designListDiv = document.getElementById('designList');
            const resultDiv = document.getElementById('result');
            
            loadingDiv.style.display = 'block';
            designListDiv.innerHTML = '';
            resultDiv.innerHTML = '';
            
            try {
                const response = await fetch('/buildhub/backend/api/homeowner/get_received_designs.php', {
                    credentials: 'include'
                });
                
                const data = await response.json();
                
                loadingDiv.style.display = 'none';
                
                if (data.success) {
                    currentDesigns = data.designs || [];
                    displayDesigns(currentDesigns);
                } else {
                    displayError('Failed to load designs: ' + (data.message || 'Unknown error'));
                }
                
            } catch (error) {
                loadingDiv.style.display = 'none';
                displayError('Network error: ' + error.message);
            }
        }
        
        function displayDesigns(designs) {
            const designListDiv = document.getElementById('designList');
            
            if (designs.length === 0) {
                designListDiv.innerHTML = '<p>No designs found.</p>';
                return;
            }
            
            let html = '<h3>📋 Available Designs</h3>';
            
            designs.forEach(design => {
                const isHousePlan = design.source_type === 'house_plan';
                const designType = isHousePlan ? 'House Plan' : 'Regular Design';
                const idDisplay = isHousePlan ? `${design.id} (House Plan ID: ${design.house_plan_id})` : design.id;
                
                html += `
                <div class="design-item">
                    <div class="design-info">
                        <div class="design-title">${design.design_title}</div>
                        <div class="design-meta">
                            Type: ${designType}<br>
                            ID: ${idDisplay}<br>
                            Architect: ${design.architect.name}<br>
                            Created: ${new Date(design.created_at).toLocaleString()}
                        </div>
                    </div>
                    <div class="design-actions">
                        <button class="btn danger" onclick="testDeleteDesign('${design.id}', '${design.design_title.replace(/'/g, "\\'")}')">
                            🗑️ Delete
                        </button>
                    </div>
                </div>`;
            });
            
            designListDiv.innerHTML = html;
        }
        
        async function testDeleteDesign(designId, designTitle) {
            if (!confirm(`Are you sure you want to delete this design?\n\n"${designTitle}"\n\nThis action cannot be undone.`)) {
                return;
            }
            
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div class="result">Deleting design...</div>';
            
            try {
                let apiUrl, requestBody;
                
                // Check if this is a house plan (ID starts with 'hp_')
                if (typeof designId === 'string' && designId.startsWith('hp_')) {
                    // Handle house plan deletion
                    const housePlanId = designId.replace('hp_', ''); // Extract numeric ID
                    apiUrl = '/buildhub/backend/api/homeowner/delete_house_plan.php';
                    requestBody = { house_plan_id: parseInt(housePlanId) };
                    
                    console.log('Deleting house plan:', { designId, housePlanId, requestBody });
                } else {
                    // Handle regular design deletion
                    apiUrl = '/buildhub/backend/api/homeowner/delete_design.php';
                    requestBody = { design_id: designId };
                    
                    console.log('Deleting regular design:', { designId, requestBody });
                }
                
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(requestBody)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    displaySuccess(`✅ ${result.message}\n\nDesign "${designTitle}" has been deleted successfully.`);
                    
                    // Remove from current designs list and refresh display
                    currentDesigns = currentDesigns.filter(d => d.id !== designId);
                    displayDesigns(currentDesigns);
                    
                } else {
                    displayError(`❌ Deletion failed: ${result.message}`);
                }
                
            } catch (error) {
                displayError(`❌ Network error: ${error.message}`);
            }
        }
        
        function displaySuccess(message) {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = `<div class="result success">${message}</div>`;
        }
        
        function displayError(message) {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = `<div class="result error">${message}</div>`;
        }
        
        function clearResults() {
            document.getElementById('designList').innerHTML = '';
            document.getElementById('result').innerHTML = '';
            currentDesigns = [];
        }
        
        // Load designs on page load
        window.onload = function() {
            loadDesigns();
        };
    </script>
</body>
</html>
