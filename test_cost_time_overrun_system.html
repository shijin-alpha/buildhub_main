<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cost & Time Overrun System Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            text-align: center;
        }
        
        .header h1 {
            color: #333;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #666;
            font-size: 14px;
        }
        
        .test-controls {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            text-align: center;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: white;
            font-size: 18px;
        }
        
        .loading.active {
            display: block;
        }
        
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .results {
            display: none;
        }
        
        .results.active {
            display: block;
        }
        
        .summary-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }
        
        .summary-card h2 {
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .status-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }
        
        .status-badge.passed {
            background: #10b981;
            color: white;
        }
        
        .status-badge.failed {
            background: #ef4444;
            color: white;
        }
        
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .summary-item {
            text-align: center;
            padding: 20px;
            background: #f8fafc;
            border-radius: 10px;
        }
        
        .summary-item .label {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 5px;
        }
        
        .summary-item .value {
            color: #1e293b;
            font-size: 24px;
            font-weight: bold;
        }
        
        .test-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        
        .test-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e2e8f0;
        }
        
        .test-header h3 {
            color: #333;
            font-size: 18px;
        }
        
        .test-details {
            background: #f8fafc;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
        }
        
        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e2e8f0;
        }
        
        .detail-row:last-child {
            border-bottom: none;
        }
        
        .detail-label {
            color: #64748b;
            font-weight: 500;
        }
        
        .detail-value {
            color: #1e293b;
            font-weight: bold;
        }
        
        .verification-box {
            background: #10b981;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            font-weight: 500;
        }
        
        .warning-box {
            background: #f59e0b;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            font-weight: 500;
        }
        
        .error-box {
            background: #ef4444;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            font-weight: 500;
        }
        
        .breakdown-table {
            width: 100%;
            margin-top: 10px;
            border-collapse: collapse;
        }
        
        .breakdown-table th {
            background: #e2e8f0;
            padding: 10px;
            text-align: left;
            font-size: 14px;
            color: #475569;
        }
        
        .breakdown-table td {
            padding: 10px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 14px;
        }
        
        .icon {
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧪 Cost & Time Overrun System Test</h1>
            <p>Comprehensive testing of the overrun calculation system without waiting for real construction completion</p>
        </div>
        
        <div class="test-controls">
            <button class="btn" id="runTestBtn" onclick="runTest()">
                🚀 Run Complete Test Suite
            </button>
        </div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Running tests... Creating test project and simulating complete lifecycle</p>
        </div>
        
        <div class="results" id="results">
            <!-- Results will be inserted here -->
        </div>
    </div>
    
    <script>
        async function runTest() {
            const btn = document.getElementById('runTestBtn');
            const loading = document.getElementById('loading');
            const results = document.getElementById('results');
            
            // Show loading
            btn.disabled = true;
            loading.classList.add('active');
            results.classList.remove('active');
            results.innerHTML = '';
            
            try {
                // Use port 8000 for backend API calls
                const response = await fetch('http://localhost:8000/test_cost_time_overrun_system.php');
                const data = await response.json();
                
                // Hide loading
                loading.classList.remove('active');
                btn.disabled = false;
                
                // Show results
                results.classList.add('active');
                displayResults(data);
                
            } catch (error) {
                loading.classList.remove('active');
                btn.disabled = false;
                results.classList.add('active');
                results.innerHTML = `
                    <div class="error-box">
                        <strong>Error:</strong> ${error.message}
                    </div>
                `;
            }
        }
        
        function displayResults(data) {
            const results = document.getElementById('results');
            
            if (data.error) {
                results.innerHTML = `
                    <div class="error-box">
                        <strong>Test Execution Failed:</strong> ${data.error}
                    </div>
                `;
                return;
            }
            
            let html = '';
            
            // Summary Card
            if (data.summary) {
                const summary = data.summary;
                const statusClass = summary.failed === 0 ? 'passed' : 'failed';
                
                html += `
                    <div class="summary-card">
                        <h2>
                            <span class="icon">${summary.failed === 0 ? '✅' : '❌'}</span>
                            Test Summary
                            <span class="status-badge ${statusClass}">${summary.overall_status}</span>
                        </h2>
                        
                        <div class="summary-grid">
                            <div class="summary-item">
                                <div class="label">Total Tests</div>
                                <div class="value">${summary.total_tests}</div>
                            </div>
                            <div class="summary-item">
                                <div class="label">Passed</div>
                                <div class="value" style="color: #10b981;">${summary.passed}</div>
                            </div>
                            <div class="summary-item">
                                <div class="label">Failed</div>
                                <div class="value" style="color: #ef4444;">${summary.failed}</div>
                            </div>
                            <div class="summary-item">
                                <div class="label">Success Rate</div>
                                <div class="value">${summary.success_rate}</div>
                            </div>
                        </div>
                        
                        ${summary.test_project_id ? `
                            <div class="test-details" style="margin-top: 20px;">
                                <div class="detail-row">
                                    <span class="detail-label">Test Project ID:</span>
                                    <span class="detail-value">${summary.test_project_id}</span>
                                </div>
                                <div class="detail-row">
                                    <span class="detail-label">Cleanup Note:</span>
                                    <span class="detail-value">${summary.cleanup_note}</span>
                                </div>
                            </div>
                        ` : ''}
                    </div>
                `;
            }
            
            // Individual Test Cards
            if (data.tests) {
                for (const [key, test] of Object.entries(data.tests)) {
                    html += generateTestCard(test);
                }
            }
            
            results.innerHTML = html;
        }
        
        function generateTestCard(test) {
            const statusClass = test.status === 'passed' ? 'passed' : 'failed';
            const statusIcon = test.status === 'passed' ? '✅' : '❌';
            
            let html = `
                <div class="test-card">
                    <div class="test-header">
                        <h3>${test.name}</h3>
                        <span class="status-badge ${statusClass}">${statusIcon} ${test.status.toUpperCase()}</span>
                    </div>
            `;
            
            // Error
            if (test.error) {
                html += `<div class="error-box"><strong>Error:</strong> ${test.error}</div>`;
            }
            
            // Verification
            if (test.verification) {
                html += `<div class="verification-box">${test.verification}</div>`;
            }
            
            // Warning
            if (test.warning) {
                html += `<div class="warning-box"><strong>Warning:</strong> ${test.warning}</div>`;
            }
            
            // Details
            if (test.details) {
                html += '<div class="test-details">';
                html += renderDetails(test.details);
                html += '</div>';
            }
            
            // Checks
            if (test.checks) {
                html += '<div class="test-details" style="margin-top: 15px;">';
                html += '<strong style="display: block; margin-bottom: 10px;">System Checks:</strong>';
                for (const [key, value] of Object.entries(test.checks)) {
                    const checkIcon = value ? '✅' : '❌';
                    html += `
                        <div class="detail-row">
                            <span class="detail-label">${formatKey(key)}</span>
                            <span class="detail-value">${checkIcon} ${value ? 'Pass' : 'Fail'}</span>
                        </div>
                    `;
                }
                html += '</div>';
            }
            
            // Project Data
            if (test.project_data) {
                html += '<div class="test-details" style="margin-top: 15px;">';
                html += '<strong style="display: block; margin-bottom: 10px;">Project Data:</strong>';
                html += renderDetails(test.project_data);
                html += '</div>';
            }
            
            html += '</div>';
            return html;
        }
        
        function renderDetails(details, level = 0) {
            let html = '';
            
            for (const [key, value] of Object.entries(details)) {
                if (Array.isArray(value)) {
                    // Handle arrays (like payment breakdowns)
                    if (value.length > 0 && typeof value[0] === 'object') {
                        html += `
                            <div style="margin-top: 10px;">
                                <strong>${formatKey(key)}:</strong>
                                <table class="breakdown-table">
                                    <thead>
                                        <tr>
                                            ${Object.keys(value[0]).map(k => `<th>${formatKey(k)}</th>`).join('')}
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${value.map(item => `
                                            <tr>
                                                ${Object.values(item).map(v => `<td>${formatValue(v)}</td>`).join('')}
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        `;
                    } else {
                        html += `
                            <div class="detail-row">
                                <span class="detail-label">${formatKey(key)}:</span>
                                <span class="detail-value">${value.join(', ')}</span>
                            </div>
                        `;
                    }
                } else if (typeof value === 'object' && value !== null) {
                    // Handle nested objects
                    html += `
                        <div style="margin-top: 10px; padding-left: ${level * 20}px;">
                            <strong>${formatKey(key)}:</strong>
                            <div style="margin-left: 20px;">
                                ${renderDetails(value, level + 1)}
                            </div>
                        </div>
                    `;
                } else {
                    // Handle simple values
                    html += `
                        <div class="detail-row">
                            <span class="detail-label">${formatKey(key)}:</span>
                            <span class="detail-value">${formatValue(value)}</span>
                        </div>
                    `;
                }
            }
            
            return html;
        }
        
        function formatKey(key) {
            return key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
        }
        
        function formatValue(value) {
            if (typeof value === 'number' && value > 1000) {
                return '₹' + value.toLocaleString('en-IN');
            }
            return value;
        }
    </script>
</body>
</html>
